<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haruto Fukudome Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        /* --- テーマ設定 --- */
        :root {
            --bg-color: #ffffff; --text-color: #111111;
            --marker-bar: #111111; --marker-text: #ffffff;
        }
        body.theme-dark {
            --bg-color: #000000; --text-color: #f5f5f7;
            --marker-bar: #f5f5f7; --marker-text: #000000;
        }

        /* --- 基本スタイル --- */
        body, html {
            margin: 0; padding: 0; width: 100%; 
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            transition: background-color 0.8s ease, color 0.8s ease;
        }
        #webgl-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; 
        }
        .content-section {
            position: relative; z-index: 10; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; pointer-events: none; 
        }
        .text-box { 
            pointer-events: auto; text-align: center; max-width: 900px; padding: 20px;
        }

        /* マーカー */
        .marker {
            display: inline; position: relative; color: var(--text-color);
            background-image: linear-gradient(to right, var(--marker-bar) 0%, var(--marker-bar) 100%);
            background-repeat: no-repeat; background-size: 0% 100%; background-position: 0 0;
            transition: background-size 0.6s cubic-bezier(0.22, 1, 0.36, 1), color 0.4s ease;
            padding: 4px 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; line-height: 1.6;
        }
        .marker.active { background-size: 100% 100%; color: var(--marker-text); }
        .delay-1 { transition-delay: 0.1s; } .delay-2 { transition-delay: 0.2s; }

        h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.02em; line-height: 1.3; }
        p { font-size: 1.1rem; font-weight: 500; line-height: 2.2; white-space: pre-line; /* 改行コードを反映 */ }

        #works-section { height: 400vh; justify-content: flex-start; padding-top: 10vh; }
        .sticky-wrapper { position: sticky; top: 10vh; width: 100%; display: flex; justify-content: center; }

        .scroll-icon { margin-top: 60px; font-size: 2rem; opacity: 0.3; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(10px);} }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <section class="content-section" id="sec-intro">
        <div class="text-box" id="intro-content">
            <h1>Loading...</h1>
        </div>
    </section>

    <section class="content-section" id="sec-about">
        <div class="text-box" id="about-content">
            <h1>Loading...</h1>
        </div>
    </section>

    <section class="content-section" id="works-section">
        <div class="sticky-wrapper">
            <div class="text-box">
                <h1><span class="marker">Selected Works</span></h1>
                <p><span class="marker delay-1">Scroll to Ascend & Click</span></p>
            </div>
        </div>
    </section>

    <script>
        // グローバル変数
        let worksData = []; 
        let introGroup, aboutGroup, carousel;
        
        // --- 0. JSONデータの読み込みと初期化 ---
        async function init() {
            try {
                // fetchでjsonデータを取得
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                // データの反映: HTMLテキスト
                applyTextData(data);
                
                // データの反映: 3Dオブジェクト
                create3DObjects(data);
                
            } catch (error) {
                console.error('Error loading data.json:', error);
                document.getElementById('intro-content').innerHTML = `
                    <h1>Error Loading Data</h1>
                    <p style="font-size:0.9rem">ローカル環境で直接ファイルを開いているため、セキュリティ制限によりjsonが読み込めません。<br>
                    GitHubにアップロードするか、VS Codeの「Live Server」機能を使用してください。</p>`;
            }
        }

        function applyTextData(data) {
            // Introセクション
            const introHTML = `
                <h1><span class="marker">${data.profile.name}</span></h1>
                <p>
                    <span class="marker delay-1">${data.profile.subtitle}</span><br>
                    <span class="marker delay-2">${data.profile.catchphrase}</span>
                </p>
                <div class="scroll-icon">↓</div>
            `;
            document.getElementById('intro-content').innerHTML = introHTML;

            // Aboutセクション
            const aboutHTML = `
                <h1><span class="marker">${data.about.title}</span></h1>
                <p><span class="marker delay-1">${data.about.text}</span></p>
            `;
            document.getElementById('about-content').innerHTML = aboutHTML;

            // Worksデータ保持
            worksData = data.works;

            // マーカー監視を再開
            setTimeout(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) entry.target.classList.add('active');
                        else entry.target.classList.remove('active');
                    });
                }, { threshold: 0.5, rootMargin: "-10% 0px -10% 0px" });
                document.querySelectorAll('.marker').forEach(el => observer.observe(el));
            }, 100);
        }

        // --- 2. Three.js セットアップ ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const fogColor = new THREE.Color(0xffffff);
        scene.fog = new THREE.Fog(fogColor, 10, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 14;

        function createTextTexture(text, color) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 128;
            ctx.fillStyle = "rgba(0,0,0,0)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 80px Arial'; ctx.fillStyle = color;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width/2, canvas.height/2);
            return new THREE.CanvasTexture(canvas);
        }

        // --- 3. 3Dオブジェクト生成 ---
        function create3DObjects(data) {
            // Group 1: Intro
            introGroup = new THREE.Group(); scene.add(introGroup);
            const wIntro = data.keywords.intro;
            const matWireBlack = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2 });
            const geoBox = new THREE.BoxGeometry(1,1,1);
            
            for(let i=0; i<60; i++){
                if(Math.random()>0.5){
                    const map = createTextTexture(wIntro[Math.floor(Math.random()*wIntro.length)], "#000000");
                    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: map, transparent: true, opacity: 0.7 }));
                    sp.position.set((Math.random()-0.5)*40, (Math.random()-0.5)*40, (Math.random()-0.5)*30);
                    sp.scale.set(6, 1.5, 1); sp.userData = { speedY: Math.random()*0.01 + 0.005 }; introGroup.add(sp);
                } else {
                    const line = new THREE.LineSegments(new THREE.EdgesGeometry(geoBox), matWireBlack);
                    line.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*50, (Math.random()-0.5)*30);
                    line.scale.setScalar(Math.random()*2); line.userData = { rot: Math.random()*0.01 }; introGroup.add(line);
                }
            }

            // Group 2: About
            aboutGroup = new THREE.Group(); scene.add(aboutGroup); aboutGroup.visible = false;
            const wAbout = data.keywords.about;
            for(let i=0; i<100; i++){
                const map = createTextTexture(wAbout[Math.floor(Math.random()*wAbout.length)], "#ffffff");
                const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: map, transparent: true, opacity: 0.9 }));
                sp.position.set((Math.random()-0.5)*80, (Math.random()-0.5)*40, (Math.random()-0.5)*20);
                sp.scale.set(6, 1.5, 1); sp.userData = { speedX: -(Math.random()*0.1 + 0.05) }; aboutGroup.add(sp);
            }

            // Group 3: Works
            carousel = new THREE.Group(); scene.add(carousel);
            const loader = new THREE.TextureLoader();
            const radius = 9.0; 
            const yStep = 4.0;
            const totalHelixHeight = (worksData.length - 1) * yStep;

            worksData.forEach((work, i) => {
                const angle = (i / worksData.length) * Math.PI * 2;
                const border = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 2.6), new THREE.MeshBasicMaterial({ color: 0x000000 }));
                
                let mat;
                if (work.image && work.image !== "") {
                    const tex = loader.load(work.image);
                    mat = new THREE.MeshBasicMaterial({ map: tex, color: 0xffffff });
                } else {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512; canvas.height = 300;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = "#f8f8f8"; ctx.fillRect(0,0,512,300);
                    ctx.fillStyle = "#111"; ctx.font = "bold 40px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(work.title, 256, 120);
                    if(work.desc) {
                        ctx.font = "20px Arial"; ctx.fillStyle = "#555";
                        ctx.fillText(work.desc.substring(0, 30) + "...", 256, 180);
                    }
                    mat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) });
                }

                const card = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 2.4), mat);
                card.position.z = 0.05;

                const g = new THREE.Group();
                g.add(border); g.add(card);
                
                g.position.x = Math.cos(angle) * radius;
                g.position.z = Math.sin(angle) * radius;
                g.position.y = i * yStep - (totalHelixHeight / 2);
                
                g.lookAt(0, g.position.y, 0); g.rotateY(Math.PI);

                g.userData = { url: work.url, title: work.title };
                carousel.add(g);
            });

            carousel.position.y = -totalHelixHeight * 3;
            carousel.rotation.x = 0.1;
        }

        // --- 4. スクロール制御 ---
        const body = document.body;
        let isDarkMode = false;
        const targetFogColor = new THREE.Color(0xffffff);
        const secAbout = document.getElementById('sec-about');
        const secWorks = document.getElementById('works-section');

        function lerp(start, end, factor) { return (1 - factor) * start + factor * end; }

        function updateScroll() {
            // ロードが完了していない場合は何もしない
            if(!carousel) return;

            const center = window.innerHeight / 2;
            const aboutRect = secAbout.getBoundingClientRect();
            const worksRect = secWorks.getBoundingClientRect();

            let shouldBeDark = (aboutRect.top <= center && worksRect.top > center);
            if (shouldBeDark !== isDarkMode) {
                isDarkMode = shouldBeDark;
                if (isDarkMode) {
                    body.classList.add('theme-dark'); targetFogColor.setHex(0x000000);
                    introGroup.visible = false; aboutGroup.visible = true;
                } else {
                    body.classList.remove('theme-dark'); targetFogColor.setHex(0xffffff);
                    introGroup.visible = (worksRect.top > center);
                    aboutGroup.visible = false;
                }
            }
            if (!isDarkMode) introGroup.visible = (worksRect.top > center);

            const scrollY = window.scrollY;
            const windowH = window.innerHeight;
            const worksTop = secWorks.offsetTop;
            const worksHeight = secWorks.offsetHeight;

            const startScroll = worksTop - windowH * 0.2; 
            const endScroll = worksTop + worksHeight - windowH * 0.8;
            const totalHelixHeight = (worksData.length - 1) * 4.0;

            let targetY = carousel.position.y;
            let targetRotY = carousel.rotation.y;

            if (scrollY > startScroll && scrollY < endScroll) {
                const progress = (scrollY - startScroll) / (endScroll - startScroll);
                const rawIndex = progress * (worksData.length - 1);
                targetY = -(rawIndex * 4.0 - (totalHelixHeight / 2));
                targetRotY = -(rawIndex / worksData.length) * Math.PI * 2;
            } else if (scrollY <= startScroll) {
                targetY = -totalHelixHeight * 3; targetRotY = 0;
            } else {
                targetY = totalHelixHeight * 3;
            }

            carousel.position.y = lerp(carousel.position.y, targetY, 0.08);
            carousel.rotation.y = lerp(carousel.rotation.y, targetRotY, 0.08);
            scene.fog.color.lerp(targetFogColor, 0.05);
        }

        // --- 5. クリック＆ホバー ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        window.addEventListener('mousemove', e => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            checkIntersection();
        });

        function checkIntersection() {
            // ロード完了前はスキップ
            if(!carousel) return;

            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(carousel.children, true);
            
            carousel.children.forEach(group => {
                if(group.scale.x > 1.0) group.scale.lerp(new THREE.Vector3(1,1,1), 0.2);
                group.children[1].material.color.lerp(new THREE.Color(0xf2f2f2), 0.2);
            });

            if (hits.length > 0) {
                const hitObj = hits[0].object;
                const parentGroup = hitObj.parent;
                if (parentGroup) {
                    document.body.style.cursor = 'pointer';
                    parentGroup.scale.lerp(new THREE.Vector3(1.2, 1.2, 1.2), 0.2);
                    parentGroup.children[1].material.color.lerp(new THREE.Color(0xffffff), 0.3);
                    return;
                }
            }
            document.body.style.cursor = 'default';
        }

        window.addEventListener('click', e => {
            // ロード完了前はスキップ
            if(!carousel) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(carousel.children, true);

            if (hits.length > 0) {
                const parentGroup = hits[0].object.parent;
                if (parentGroup) {
                    const data = parentGroup.userData;
                    parentGroup.children[1].material.color.set(0xffff00);
                    setTimeout(() => {
                        if (data.url && data.url !== "#" && data.url !== "") {
                            window.open(data.url, '_blank');
                        } else {
                            alert(`【Project: ${data.title}】\n詳細ページは準備中です。\n(URL未設定)`);
                        }
                    }, 100);
                }
            }
        });

        // --- 6. アニメーション ---
        let mouseX=0, mouseY=0;
        window.addEventListener('mousemove', e=>{
            mouseX=(e.clientX/window.innerWidth-0.5)*2;
            mouseY=(e.clientY/window.innerHeight-0.5)*2;
        });

        function animate() {
            requestAnimationFrame(animate);
            updateScroll();
            checkIntersection(); 

            if(introGroup && introGroup.visible){
                introGroup.children.forEach(o=>{
                    if(o.isSprite){ o.position.y += o.userData.speedY; if(o.position.y>20) o.position.y=-20; }
                    else { o.rotation.x += o.userData.rot; o.rotation.y += o.userData.rot; }
                });
            }
            if(aboutGroup && aboutGroup.visible){
                aboutGroup.children.forEach(o=>{
                    o.position.x += o.userData.speedX; if(o.position.x < -40) o.position.x = 40;
                });
            }
            
            camera.position.x += (mouseX*0.5 - camera.position.x)*0.05;
            camera.position.y += (-mouseY*0.5 - camera.position.y)*0.05;
            camera.lookAt(0,0,0);

            renderer.render(scene, camera);
        }
        
        // スタート
        init();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

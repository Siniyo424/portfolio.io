<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siniyo's Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        :root {
            --bg-color: #ffffff; --text-color: #111111;
            --marker-bar: #111111; --marker-text: #ffffff;
        }
        body.theme-dark {
            --bg-color: #000000; --text-color: #f5f5f7;
            --marker-bar: #f5f5f7; --marker-text: #000000;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; 
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            transition: background-color 0.8s ease, color 0.8s ease;
        }
        #webgl-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; 
        }
        .content-section {
            position: relative; z-index: 10; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; pointer-events: none; 
        }
        .text-box { 
            pointer-events: auto; text-align: center; max-width: 900px; padding: 20px;
        }
        .marker {
            display: inline; position: relative; color: var(--text-color);
            background-image: linear-gradient(to right, var(--marker-bar) 0%, var(--marker-bar) 100%);
            background-repeat: no-repeat; background-size: 0% 100%; background-position: 0 0;
            transition: background-size 0.6s cubic-bezier(0.22, 1, 0.36, 1), color 0.4s ease;
            padding: 4px 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; line-height: 1.6;
        }
        .marker.active { background-size: 100% 100%; color: var(--marker-text); }
        .delay-1 { transition-delay: 0.1s; } .delay-2 { transition-delay: 0.2s; }
        h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.02em; line-height: 1.3; }
        p { font-size: 1.1rem; font-weight: 500; line-height: 2.2; white-space: pre-line; }
        #works-section { height: 400vh; justify-content: flex-start; padding-top: 10vh; }
        .sticky-wrapper { position: sticky; top: 10vh; width: 100%; display: flex; justify-content: center; }
        .scroll-icon { margin-top: 60px; font-size: 2rem; opacity: 0.3; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(10px);} }
    </style>
</head>
<body>
    <div id="webgl-container"></div>

    <section class="content-section" id="sec-intro">
        <div class="text-box" id="intro-content">
            <h1>Loading...</h1>
        </div>
    </section>

    <section class="content-section" id="sec-about">
        <div class="text-box" id="about-content">
            <h1>Loading...</h1>
        </div>
    </section>

    <section class="content-section" id="works-section">
        <div class="sticky-wrapper">
            <div class="text-box">
                <h1><span class="marker">Selected Works</span></h1>
                <p><span class="marker delay-1">Scroll to Ascend & Click</span></p>
            </div>
        </div>
    </section>

    <script>
        let worksData = [], introGroup, aboutGroup, carousel;
        
        async function init() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                applyTextData(data);
                create3DObjects(data);
            } catch (error) {
                console.error(error);
                document.getElementById('intro-content').innerHTML = `<h1>Loading Data...</h1><p>GitHub上で正しく表示されます。</p>`;
            }
        }

        function applyTextData(data) {
            document.getElementById('intro-content').innerHTML = `
                <h1><span class="marker">${data.profile.name}</span></h1>
                <p><span class="marker delay-1">${data.profile.subtitle}</span><br><span class="marker delay-2">${data.profile.catchphrase}</span></p>
                <div class="scroll-icon">↓</div>`;
            document.getElementById('about-content').innerHTML = `
                <h1><span class="marker">${data.about.title}</span></h1>
                <p><span class="marker delay-1">${data.about.text}</span></p>`;
            worksData = data.works;
            setTimeout(() => { document.querySelectorAll('.marker').forEach(el => new IntersectionObserver((es)=>es.forEach(e=>{e.target.classList.toggle('active',e.isIntersecting)}),{threshold:0.5}).observe(el)); }, 100);
        }

        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0xffffff, 10, 60);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 14;

        function createTextTexture(text, color) {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 128;
            ctx.fillStyle = "rgba(0,0,0,0)"; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.font = 'bold 80px Arial'; ctx.fillStyle = color;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width/2, canvas.height/2);
            return new THREE.CanvasTexture(canvas);
        }

        function create3DObjects(data) {
            introGroup = new THREE.Group(); scene.add(introGroup);
            const matWire = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2 });
            const geoBox = new THREE.BoxGeometry(1,1,1);
            for(let i=0; i<60; i++){
                if(Math.random()>0.5){
                    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: createTextTexture(data.keywords.intro[Math.floor(Math.random()*data.keywords.intro.length)], "#000000"), transparent: true, opacity: 0.7 }));
                    sp.position.set((Math.random()-0.5)*40, (Math.random()-0.5)*40, (Math.random()-0.5)*30);
                    sp.scale.set(6,1.5,1); sp.userData = { speedY: Math.random()*0.01+0.005 }; introGroup.add(sp);
                } else {
                    const line = new THREE.LineSegments(new THREE.EdgesGeometry(geoBox), matWire);
                    line.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*50, (Math.random()-0.5)*30);
                    line.scale.setScalar(Math.random()*2); line.userData = { rot: Math.random()*0.01 }; introGroup.add(line);
                }
            }

            aboutGroup = new THREE.Group(); scene.add(aboutGroup); aboutGroup.visible = false;
            for(let i=0; i<100; i++){
                const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: createTextTexture(data.keywords.about[Math.floor(Math.random()*data.keywords.about.length)], "#ffffff"), transparent: true, opacity: 0.9 }));
                sp.position.set((Math.random()-0.5)*80, (Math.random()-0.5)*40, (Math.random()-0.5)*20);
                sp.scale.set(6,1.5,1); sp.userData = { speedX: -(Math.random()*0.1+0.05) }; aboutGroup.add(sp);
            }

            carousel = new THREE.Group(); scene.add(carousel);
            const radius = 9.0; const yStep = 4.0; const totalH = (worksData.length-1)*yStep;
            const loader = new THREE.TextureLoader();
            
            worksData.forEach((work, i) => {
                const angle = (i/worksData.length)*Math.PI*2;
                let mat;
                if(work.image){ mat = new THREE.MeshBasicMaterial({ map: loader.load(work.image), color:0xffffff }); }
                else {
                    const c = document.createElement('canvas'); c.width=512; c.height=300;
                    const x = c.getContext('2d'); x.fillStyle="#f8f8f8"; x.fillRect(0,0,512,300);
                    x.fillStyle="#111"; x.font="bold 40px Arial"; x.textAlign="center"; x.textBaseline="middle";
                    x.fillText(work.title, 256, 120);
                    if(work.desc){ x.font="20px Arial"; x.fillStyle="#555"; x.fillText(work.desc.substring(0,30)+"...", 256, 180); }
                    mat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c) });
                }
                const card = new THREE.Mesh(new THREE.PlaneGeometry(4.0,2.4), mat); card.position.z = 0.05;
                const g = new THREE.Group(); 
                g.add(new THREE.Mesh(new THREE.PlaneGeometry(4.2,2.6), new THREE.MeshBasicMaterial({color:0x000000}))); 
                g.add(card);
                g.position.set(Math.cos(angle)*radius, i*yStep-(totalH/2), Math.sin(angle)*radius);
                g.lookAt(0, g.position.y, 0); g.rotateY(Math.PI);
                g.userData = { url: work.url, title: work.title };
                carousel.add(g);
            });
            carousel.position.y = -totalH*3; carousel.rotation.x = 0.1;
        }

        const body = document.body; let isDarkMode = false; const targetFog = new THREE.Color(0xffffff);
        const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();

        function update() {
            if(!carousel) return;
            const center = window.innerHeight/2;
            const aboutRect = document.getElementById('sec-about').getBoundingClientRect();
            const worksRect = document.getElementById('works-section').getBoundingClientRect();
            
            const dark = (aboutRect.top <= center && worksRect.top > center);
            if(dark !== isDarkMode){
                isDarkMode = dark;
                body.className = isDarkMode ? 'theme-dark' : '';
                targetFog.setHex(isDarkMode ? 0x000000 : 0xffffff);
                if(introGroup) introGroup.visible = !isDarkMode && (worksRect.top > center);
                if(aboutGroup) aboutGroup.visible = isDarkMode;
            }
            if(!isDarkMode && introGroup) introGroup.visible = (worksRect.top > center);

            const sY = window.scrollY; const wH = window.innerHeight; const wTop = worksRect.top + sY; const wHgt = document.getElementById('works-section').offsetHeight;
            const start = wTop - wH*0.2; const end = wTop + wHgt - wH*0.8;
            let ty = carousel.position.y, tr = carousel.rotation.y;
            
            if(sY > start && sY < end){
                const p = (sY - start)/(end - start);
                const idx = p * (worksData.length - 1);
                const totalH = (worksData.length - 1)*4.0;
                ty = -(idx * 4.0 - (totalH/2));
                tr = -(idx / worksData.length) * Math.PI * 2;
            } else if(sY <= start) { ty = -(worksData.length-1)*4.0*3; tr = 0; }
            else { ty = (worksData.length-1)*4.0*3; }

            carousel.position.y += (ty - carousel.position.y)*0.08;
            carousel.rotation.y += (tr - carousel.rotation.y)*0.08;
            scene.fog.color.lerp(targetFog, 0.05);

            if(introGroup && introGroup.visible) introGroup.children.forEach(o => { if(o.isSprite){ o.position.y+=o.userData.speedY; if(o.position.y>20)o.position.y=-20; } else { o.rotation.x+=o.userData.rot; o.rotation.y+=o.userData.rot; } });
            if(aboutGroup && aboutGroup.visible) aboutGroup.children.forEach(o => { o.position.x+=o.userData.speedX; if(o.position.x<-40)o.position.x=40; });
        }

        window.addEventListener('mousemove', e => {
            mouse.x=(e.clientX/window.innerWidth)*2-1; mouse.y=-(e.clientY/window.innerHeight)*2+1;
            raycaster.setFromCamera(mouse, camera);
            if(carousel){
                const hits = raycaster.intersectObjects(carousel.children, true);
                carousel.children.forEach(g=>{ if(g.scale.x>1)g.scale.lerp(new THREE.Vector3(1,1,1),0.2); });
                document.body.style.cursor = hits.length>0 ? 'pointer':'default';
                if(hits.length>0 && hits[0].object.parent){
                    hits[0].object.parent.scale.lerp(new THREE.Vector3(1.15,1.15,1.15),0.2);
                }
            }
        });

        window.addEventListener('click', () => {
            if(carousel){
                const hits = raycaster.intersectObjects(carousel.children, true);
                if(hits.length>0){
                    const d = hits[0].object.parent.userData;
                    hits[0].object.parent.children[1].material.color.set(0xffff00);
                    setTimeout(()=>{
                        if(d.url && d.url!=="#" && d.url!=="") window.open(d.url, '_blank');
                        else alert(`【${d.title}】\n(URL未設定)`);
                    },100);
                }
            }
        });

        function animate(){ requestAnimationFrame(animate); update(); renderer.render(scene, camera); }
        init(); animate();
        window.addEventListener('resize', () => { camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>

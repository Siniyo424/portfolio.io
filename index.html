<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive Portfolio JSON Loader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Montserrat:wght@900&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS設定 --- */
        :root {
            --bg-color: #f0f0f0; --text-color: #111;
            --marker-bar: #111; --marker-text: #fff;
            --font-body: 'Inter', 'Noto Sans JP', sans-serif; 
            --font-display: 'Montserrat', 'Noto Sans JP', sans-serif;
        }
        body.theme-dark {
            --bg-color: #050505; --text-color: #eee;
            --marker-bar: #eee; --marker-text: #000;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; font-family: var(--font-body);
            background-color: var(--bg-color); color: var(--text-color);
            transition: background-color 0.8s ease, color 0.8s ease;
            overflow-x: hidden;
        }
        
        #webgl-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .content-section { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; pointer-events: none; }
        .text-box { pointer-events: auto; text-align: center; max-width: 900px; }
        
        /* マーカー演出 */
        .marker { display: inline; position: relative; color: var(--text-color); background-image: linear-gradient(to right, var(--marker-bar) 0%, var(--marker-bar) 100%); background-repeat: no-repeat; background-size: 0% 100%; background-position: 0 0; transition: background-size 0.6s cubic-bezier(0.22, 1, 0.36, 1), color 0.4s ease; padding: 0 4px; }
        .marker.active { background-size: 100% 100%; color: var(--marker-text); }
        .delay-1 { transition-delay: 0.1s; } .delay-2 { transition-delay: 0.2s; }
        
        h1 { font-family: var(--font-display); font-size: 3.5rem; font-weight: 900; margin-bottom: 30px; letter-spacing: -0.02em; line-height: 1.4; white-space: pre-wrap; }
        p { font-size: 1.1rem; font-weight: 400; line-height: 2; white-space: pre-wrap; }
        
        /* スクロール領域 */
        #works-section { height: 800vh; justify-content: flex-start; }
        .sticky-wrapper { position: sticky; top: 10vh; width: 100%; display: flex; justify-content: center; pointer-events: none; }
        #sec-transition { height: 100vh; } 
        #sec-end { height: 100vh; }

        /* 左上固定ラベル */
        #section-label {
            position: fixed; top: 40px; left: 40px; z-index: 100;
            font-family: var(--font-display); font-size: 1.2rem; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase;
            color: #fff; mix-blend-mode: difference;
            opacity: 0; transform: translateY(-20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }
        #section-label.visible { opacity: 1; transform: translateY(0); }

        /* 固定ビッグタイトル */
        .fixed-title-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; z-index: 50;
        }
        .big-title {
            font-family: var(--font-display); font-size: 8vw; font-weight: 900; color: #fff;
            text-transform: uppercase; letter-spacing: 0.05em; text-align: center; white-space: nowrap;
            opacity: 0; transform: scale(0.8); will-change: opacity, transform;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        /* モーダル設定 */
        #project-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; pointer-events: none; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        #project-modal.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .modal-card { width: 85%; max-width: 1200px; height: 80vh; background: #fff; color: #111; border-radius: 30px; box-shadow: 0 50px 100px -20px rgba(0,0,0,0.8); display: grid; grid-template-columns: 1.3fr 1fr; overflow: hidden; transform: scale(0.95) translateY(30px); transition: 0.5s; }
        #project-modal.active .modal-card { transform: scale(1) translateY(0); }
        .modal-visual { background: #000; display: flex; align-items: center; justify-content: center; }
        .visual-content { width: 100%; height: 100%; object-fit: cover; }
        .modal-info { padding: 50px; display: flex; flex-direction: column; overflow-y: auto; }
        .modal-header { border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        .modal-title { font-family: var(--font-display); font-size: 2rem; font-weight: 900; margin: 0; letter-spacing: -0.01em; line-height: 1.4; }
        .modal-meta { margin-top: 10px; display: flex; gap: 20px; font-size: 0.9rem; color: #666; font-weight: 600; text-transform: uppercase; }
        .modal-desc { font-size: 1rem; line-height: 2; color: #444; white-space: pre-wrap; margin-bottom: 30px; }
        
        .modal-link-btn {
            display: inline-block; padding: 15px 30px; background: #000; color: #fff;
            text-decoration: none; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em;
            border-radius: 50px; align-self: flex-start; transition: 0.3s;
        }
        .modal-link-btn:hover { background: #333; transform: translateY(-3px); }

        #close-btn { position: absolute; top: 30px; right: 30px; width: 70px; height: 70px; background: #fff; color: #000; border-radius: 50%; border: none; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: transform 0.3s; }
        #close-btn:hover { transform: scale(1.1) rotate(90deg); }
        
        @media (max-width: 900px) { 
            .modal-card { grid-template-columns: 1fr; grid-template-rows: 300px 1fr; height: 90vh; } 
            h1 { font-size: 2.5rem; } 
            #section-label { top: 20px; left: 20px; font-size: 1rem; }
            .big-title { font-size: 12vw; white-space: normal; line-height: 1.1; }
        }
    </style>
</head>
<body>
    <div id="webgl-container"></div>
    
    <div id="section-label">Selected Works</div>

    <div class="fixed-title-overlay">
        <div id="title-works" class="big-title">Selected Works</div>
        <div id="title-end" class="big-title" style="display:none;">To Be Continued.</div>
    </div>

    <div id="project-modal">
        <button id="close-btn">×</button>
        <div class="modal-card">
            <div class="modal-visual" id="m-visual"></div>
            <div class="modal-info">
                <div class="modal-header">
                    <h2 class="modal-title" id="m-title">Title</h2>
                    <div class="modal-meta">
                        <span id="m-date">--</span>
                        <span id="m-team">--</span>
                    </div>
                </div>
                <div class="modal-desc" id="m-desc">Desc</div>
                <a href="#" target="_blank" class="modal-link-btn" id="m-link">Visit Site</a>
            </div>
        </div>
    </div>
    
    <section class="content-section" id="sec-intro">
        <div class="text-box">
            <h1 id="intro-h1"></h1>
            <p id="intro-p"></p>
        </div>
    </section>
    
    <section class="content-section" id="sec-about">
        <div class="text-box">
            <h1 id="about-h1"></h1>
            <p id="about-p"></p>
        </div>
    </section>
    
    <section class="content-section" id="sec-transition"></section>
    <section class="content-section" id="works-section"></section>
    <section class="content-section" id="sec-end"></section>

    <script>
        // --- ★ Fetch & Initialization ★ ---
        
        // JSON読み込み処理
        fetch('./data.json')
            .then(response => {
                if (!response.ok) throw new Error("JSON読み込みエラー: Live Serverを使用してください");
                return response.json();
            })
            .then(data => {
                initPortfolio(data);
            })
            .catch(error => {
                console.error(error);
                alert("【エラー】data.jsonの読み込みに失敗しました。\nVS Codeの『Live Server』などで開いていますか？\n(ローカルファイルの直接ダブルクリックでは動作しません)");
            });

        function initPortfolio(portfolioData) {
            
            // 1. HTMLテキストの流し込み
            const introH1 = document.getElementById('intro-h1');
            const introP = document.getElementById('intro-p');
            introH1.innerHTML = `<span class="marker">${portfolioData.profile.catchphrase.replace(/\n/g, '<br>')}</span>`;
            introP.innerHTML = `<span class="marker delay-1">${portfolioData.profile.subtitle}</span><br><span class="marker delay-2">${portfolioData.profile.name}</span>`;

            const aboutH1 = document.getElementById('about-h1');
            const aboutP = document.getElementById('about-p');
            aboutH1.innerHTML = `<span class="marker">${portfolioData.about.title}</span>`;
            aboutP.innerHTML = `<span class="marker delay-1">${portfolioData.about.text}</span>`;

            // マーカーアニメーション開始
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { entry.target.classList.toggle('active', entry.isIntersecting); });
            }, { threshold: 0.5, rootMargin: "-10% 0px -10% 0px" });
            document.querySelectorAll('.marker').forEach(el => observer.observe(el));

            // 2. Three.jsの開始
            startThreeJS(portfolioData);
        }


        // --- Three.js Logic ---
        function startThreeJS(data) {
            const container = document.getElementById('webgl-container');
            const scene = new THREE.Scene();
            const fogColor = new THREE.Color(0xf0f0f0);
            scene.fog = new THREE.Fog(fogColor, 20, 150);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 300);
            camera.position.z = 30; 

            // Texture Helper
            function createHighQualityTextTexture(text, color, fontSize = 200) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const width = 2048; const height = 512; 
                canvas.width = width; canvas.height = height;
                ctx.font = `900 ${fontSize}px 'Montserrat', 'Noto Sans JP', sans-serif`;
                ctx.fillStyle = color;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(text, width/2, height/2);
                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                texture.magFilter = THREE.LinearFilter;
                return texture;
            }

            // 1. Intro Objects (Keywords from JSON)
            const introGroup = new THREE.Group(); scene.add(introGroup);
            const wIntro = data.keywords.intro;
            for(let i=0; i<40; i++){
                const text = wIntro[i % wIntro.length];
                const map = createHighQualityTextTexture(text, "#111", 100);
                const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: map, transparent: true, opacity: 0.4 }));
                sp.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*40, (Math.random()-0.5)*20);
                sp.scale.set(10, 2.5, 1); introGroup.add(sp);
            }

            // 2. About Objects (Keywords from JSON)
            const aboutGroup = new THREE.Group(); scene.add(aboutGroup); aboutGroup.visible = false;
            const wAbout = data.keywords.about;
            for(let i=0; i<80; i++){
                const text = wAbout[i % wAbout.length];
                const map = createHighQualityTextTexture(text, "#fff", 100);
                const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: map, transparent: true, opacity: 0.8 }));
                sp.position.set((Math.random()-0.5)*80, (Math.random()-0.5)*40, (Math.random()-0.5)*20);
                sp.scale.set(8, 2, 1); sp.userData = { speed: -(Math.random()*0.1 + 0.05) };
                aboutGroup.add(sp);
            }

            // 3. Works Objects (From JSON)
            const worksGroup = new THREE.Group(); scene.add(worksGroup); worksGroup.visible = false;
            const totalCards = 40;  
            const spreadX = 70; const spreadY = 50; const depthSpacing = 18;
            const cards = [];
            const loader = new THREE.TextureLoader();
            const cardGeometry = new THREE.PlaneGeometry(14.0, 8.4);
            const borderGeometry = new THREE.PlaneGeometry(14.3, 8.7);
            const materialCache = {};

            for(let i=0; i < totalCards; i++) {
                const workData = data.works[i % data.works.length];
                let mat;
                if(workData.image && workData.image !== "") {
                    if(!materialCache[workData.image]) {
                        const tex = loader.load(workData.image);
                        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                        materialCache[workData.image] = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
                    }
                    mat = materialCache[workData.image];
                } else {
                    if(!materialCache['default']) materialCache['default'] = new THREE.MeshBasicMaterial({ color: 0xeeeeee, side: THREE.DoubleSide });
                    mat = materialCache['default'];
                }
                const mesh = new THREE.Mesh(cardGeometry, mat);
                const border = new THREE.Mesh(borderGeometry, new THREE.MeshBasicMaterial({ color: 0x000, side: THREE.DoubleSide }));
                border.position.z = -0.1; 
                const group = new THREE.Group();
                group.add(mesh); group.add(border);
                group.userData = { data: workData, initialZ: -i * depthSpacing - Math.random() * 10 };
                group.position.set((Math.random() - 0.5) * spreadX, (Math.random() - 0.5) * spreadY, group.userData.initialZ);
                group.rotation.z = (Math.random() - 0.5) * 0.15;
                group.rotation.y = (Math.random() - 0.5) * 0.2;
                worksGroup.add(group);
                cards.push(group);
            }
            const maxWorkDepth = totalCards * depthSpacing + 50;

            // --- Animation Loop ---
            const body = document.body;
            let isDarkMode = false;
            const targetFogColor = new THREE.Color(0xf0f0f0);
            let targetCameraZ = camera.position.z;
            let hoveredObject = null;
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2(9999, 9999);
            const label = document.getElementById('section-label');
            const titleWorks = document.getElementById('title-works');
            const titleEnd = document.getElementById('title-end');

            function animate() {
                requestAnimationFrame(animate);

                const sY = window.scrollY;
                const winH = window.innerHeight;
                const aboutTop = document.getElementById('sec-about').offsetTop;
                const transTop = document.getElementById('sec-transition').offsetTop;
                const worksTop = document.getElementById('works-section').offsetTop;
                const worksH = document.getElementById('works-section').offsetHeight;
                const endTop = document.getElementById('sec-end').offsetTop;

                // 1. End
                if (sY + winH * 0.9 > endTop) { 
                    if(!isDarkMode) { isDarkMode = true; body.classList.add('theme-dark'); targetFogColor.setHex(0x000000); }
                    label.classList.remove('visible');
                    introGroup.visible = false; aboutGroup.visible = false; worksGroup.visible = true;
                    titleWorks.style.display = 'none'; titleEnd.style.display = 'block';
                    const endProgress = Math.min(1.0, Math.max(0, (sY - endTop + winH*0.5) / winH));
                    titleEnd.style.opacity = endProgress; titleEnd.style.transform = `scale(1)`; 
                    targetCameraZ = 30 - maxWorkDepth - 100;

                // 2. Works
                } else if (sY + winH * 0.5 > worksTop) {
                    if(!isDarkMode) { isDarkMode = true; body.classList.add('theme-dark'); targetFogColor.setHex(0x080808); }
                    introGroup.visible = false; aboutGroup.visible = false; worksGroup.visible = true; 
                    titleWorks.style.display = 'block'; titleEnd.style.display = 'none';
                    const worksScrollProgress = (sY - worksTop) / (worksH - winH);
                    targetCameraZ = 30 - (worksScrollProgress * maxWorkDepth);

                    if (worksScrollProgress < 0.2) {
                        label.classList.remove('visible');
                        const p = worksScrollProgress / 0.2; 
                        let op = 0; let sc = 0.5;
                        if(p < 0.5) { op = p * 2; sc = 0.5 + p; } else { op = 1.0 - (p - 0.5) * 2; sc = 1.0 + (p - 0.5) * 2; }
                        titleWorks.style.opacity = op; titleWorks.style.transform = `scale(${sc})`;
                    } else {
                        label.classList.add('visible'); titleWorks.style.opacity = 0;
                    }
                
                // 3. Transition
                } else if (sY + winH * 0.5 > transTop) {
                    if(!isDarkMode) { isDarkMode = true; body.classList.add('theme-dark'); targetFogColor.setHex(0x080808); }
                    label.classList.remove('visible'); titleWorks.style.opacity = 0; titleEnd.style.opacity = 0;
                    introGroup.visible = false; aboutGroup.visible = true; worksGroup.visible = false;
                    const transProgress = (sY + winH*0.5 - transTop) / winH;
                    const opacity = Math.max(0, 1.0 - transProgress * 1.5);
                    aboutGroup.children.forEach(o => { o.material.opacity = opacity * 0.8; o.position.x += o.userData.speed; if(o.position.x < -40) o.position.x = 40; });
                    targetCameraZ = 30;

                // 4. About
                } else if (sY + winH * 0.5 > aboutTop) {
                    if(!isDarkMode) { isDarkMode = true; body.classList.add('theme-dark'); targetFogColor.setHex(0x080808); }
                    label.classList.remove('visible'); titleWorks.style.opacity = 0;
                    introGroup.visible = false; aboutGroup.visible = true; worksGroup.visible = false;
                    aboutGroup.children.forEach(o => { o.material.opacity = 0.8; o.position.x += o.userData.speed; if(o.position.x < -40) o.position.x = 40; });
                    targetCameraZ = 30;

                // 5. Intro
                } else {
                    if(isDarkMode) { isDarkMode = false; body.classList.remove('theme-dark'); targetFogColor.setHex(0xf0f0f0); }
                    label.classList.remove('visible'); titleWorks.style.opacity = 0;
                    introGroup.visible = true; aboutGroup.visible = false; worksGroup.visible = false;
                    introGroup.children.forEach(o => { o.position.y += Math.sin(Date.now()*0.002 + o.id)*0.01; });
                    targetCameraZ = 30; 
                }

                camera.position.z += (targetCameraZ - camera.position.z) * 0.05;

                // Hover
                if (worksGroup.visible) {
                    raycaster.setFromCamera(mouse, camera);
                    const hits = raycaster.intersectObjects(worksGroup.children, true);
                    hoveredObject = null;
                    if (hits.length > 0) {
                        const target = hits[0].object.parent;
                        if (target && target.userData.data) hoveredObject = target;
                    }
                    cards.forEach(group => {
                        const targetScale = (group === hoveredObject) ? 1.1 : 1.0;
                        group.scale.setScalar(THREE.MathUtils.lerp(group.scale.x, targetScale, 0.1));
                        const targetColor = (group === hoveredObject) ? 0xffffff : 0x444444;
                        group.children[1].material.color.lerp(new THREE.Color(targetColor), 0.1);
                        group.visible = (group.position.z < camera.position.z + 20 && group.position.z > camera.position.z - 200);
                    });
                }
                scene.fog.color.lerp(targetFogColor, 0.05);
                renderer.render(scene, camera);
            }
            animate();

            // Interactions
            window.addEventListener('mousemove', (e) => {
                if (!worksGroup.visible) return;
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            const modal = document.getElementById('project-modal');
            window.addEventListener('click', (e) => {
                if(modal.classList.contains('active') || !worksGroup.visible || !hoveredObject) return;
                openModal(hoveredObject.userData.data);
            });

            function openModal(data) {
                document.getElementById('m-title').textContent = data.title;
                document.getElementById('m-desc').textContent = data.desc;
                
                // データにdate/teamがあれば表示、なければ空
                const dateText = data.date || "";
                const teamText = data.team || "";
                document.getElementById('m-date').textContent = dateText;
                document.getElementById('m-team').textContent = teamText;

                // リンクボタン制御
                const linkBtn = document.getElementById('m-link');
                if (data.url && data.url !== "#") {
                    linkBtn.style.display = "inline-block";
                    linkBtn.href = data.url;
                } else {
                    linkBtn.style.display = "none";
                }

                const v = document.getElementById('m-visual');
                v.innerHTML = "";
                if(data.image) v.innerHTML = `<img class="visual-content" src="${data.image}">`;
                else v.innerHTML = `<div style="font-size:3rem; color:#fff;">IMG</div>`;
                modal.classList.add('active');
            }
            document.getElementById('close-btn').addEventListener('click', () => {
                modal.classList.remove('active');
                setTimeout(() => { document.getElementById('m-visual').innerHTML = ""; }, 500);
            });
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
